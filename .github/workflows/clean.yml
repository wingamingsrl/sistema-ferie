name: Pulizia Automatica Notturna Storico Ferie

on:
  schedule:
    # Si attiva ogni notte alle 02:00 UTC (corrisponde alle 03:00 o 04:00 italiane)
    - cron: '0 2 * * *'
  workflow_dispatch: # Ti permette di avviare la pulizia anche a mano se vuoi

jobs:
  clean-database:
    runs-on: ubuntu-latest
    steps:
      - name: Accedi al codice del Repository
        uses: actions/checkout@v3

      - name: Configura Python sul server
        uses: actions/setup-python@v4
        with:
          python-python: '3.11'

      - name: Installa le librerie per l'Excel
        run: |
          pip install pandas openpyxl

      - name: Esegui lo script di pulizia dati
        run: python clean_history.py

      - name: Salva e carica il file Excel aggiornato su GitHub
        run: |
          git config --global user.name "GitHub Action Robot"
          git config --global user.email "actions@github.com"
          git add registro_ferie_salvato.xlsx
          git commit -m "🤖 [Robot] Pulizia automatica notturna chiusure scadute" || echo "Nessuna modifica da salvare"
          git push
