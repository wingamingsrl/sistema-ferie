name: Automazioni Logistiche Ferie WinGaming

on:
  schedule:
    # Si attiva ogni mattina alle 06:00 UTC (che corrispondono esattamente alle 08:00 italiane d'estate)
    - cron: '0 6 * * *'
  workflow_dispatch: # Ti permette di avviare il controllo anche a mano quando vuoi

jobs:
  logistica-job:
    runs-on: ubuntu-latest
    steps:
      - name: Accedi al codice del Repository
        uses: actions/checkout@v3

      - name: Configura Python sul server
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installa le librerie necessarie
        run: |
          pip install pandas openpyxl requests

      - name: 1. Invia Promemoria automatici ai Tecnici (Ore 08:00)
        env:
          # Passa in modo sicuro la password applicativa di Gmail memorizzata nei Secrets di GitHub
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD_APPLICATIVA }}
        run: python send_reminders.py

      - name: 2. Esegui la Pulizia automatica delle Ferie Scadute
        run: python clean_history.py

      - name: 3. Salva e carica il file Excel aggiornato su GitHub
        run: |
          git config --global user.name "GitHub Action Robot"
          git config --global user.email "actions@github.com"
          git add storico_ferie.xlsx
          git commit -m "🤖 [Robot] Automazione logistica e pulizia completata" || echo "Nessun dato obsoleto da pulire"
          git push
