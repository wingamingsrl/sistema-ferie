name: Sincronizzazione Automatica Ferie Snaitech WG

on:
  workflow_dispatch: # 🛡️ REINSERITO IL TELECOMANDO DELLO SMARTPHONE DI MANUELA
  schedule:
    - cron: '0 6 * * *' # Gira in automatico tutte le mattine alle 07:00 italiane

jobs:
  run-robot-snai:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Clonazione ed Estrazione Repository
        uses: actions/checkout@v4

      - name: 🐍 Configurazione Ambiente Python Aziendale
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installazione Librerie di Rete e Playwright Nativi
        run: |
          pip install pandas openpyxl playwright pyotp requests
          playwright install chromium

      - name: 🚀 ESECUZIONE CORSA ROBOT AUTOMATICO SNAITECH
        env:
          TOKEN_GITHUB_ACTIONS: ${{ secrets.GITHUB_TOKEN }}
        run: python robot_snai.py

      - name: 📸 Estrazione e Download Foto Errore Snaitech
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermata-errore-ufficio
          path: errore_visivo_snaitech.png
          retention-days: 1
