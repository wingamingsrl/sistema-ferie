name: ⏰ [Sveglia] Mantieni Attiva Plancia Streamlit

on:
  schedule:
    # ⏱️ Scatta ogni ora di ogni giorno (es. 08:00, 09:00, ecc.) per non far addormentare il server
    - cron: '0 * * * *'
  workflow_dispatch: # Ti permette di provarlo a mano premendo un tasto se serve!

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Bussata elettrica di rete alla plancia WinGaming
        run: |
          curl -I "https://streamlit.app"
          print("   ✅ Sveglia inviata! La plancia Streamlit è stata tenuta attiva con successo.")
